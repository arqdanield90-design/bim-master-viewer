name: App Android

# Compila BIM MASTER Viewer como app Android (APK) cada vez que cambia el visor
on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        working-directory: app
        run: npm ci

      - name: Copiar el visor a la app
        working-directory: app
        run: npm run sync

      - name: Compilar el APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk BIM-MASTER-Viewer.apk
          gh release create "android-1.0.${{ github.run_number }}" BIM-MASTER-Viewer.apk \
            --title "BIM MASTER Viewer para Android 1.0.${{ github.run_number }}" \
            --notes "Descarga BIM-MASTER-Viewer.apk en el celular o la tableta Android y ábrelo para instalar. Android pedirá permitir la instalación desde esta fuente la primera vez." \
            --latest
